<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Irrigation</title>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card { background: white; border-radius: 12px; padding: 16px; border: 1px solid #eee; }
    .card-label { font-size: 12px; color: #888; margin-bottom: 6px; }
    .card-value { font-size: 26px; font-weight: 500; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; margin-top: 4px; }
    .dry { background: #FAECE7; color: #993C1D; }
    .moist { background: #EAF3DE; color: #3B6D11; }
    .online { background: #EAF3DE; color: #3B6D11; }
    .pump-card { background: white; border-radius: 12px; padding: 16px; border: 1px solid #eee; margin-bottom: 20px; }
    .pump-status { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .led { width: 14px; height: 14px; border-radius: 50%; background: #ccc; }
    .led.on { background: #639922; }
    .btn { padding: 8px 18px; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 14px; margin-right: 8px; }
    .btn-on { background: #EAF3DE; color: #3B6D11; border-color: #97C459; }
    .btn-off { background: #FCEBEB; color: #A32D2D; border-color: #F09595; }
    .log-card { background: white; border-radius: 12px; padding: 16px; border: 1px solid #eee; }
    .log-title { font-size: 13px; color: #888; margin-bottom: 12px; font-weight: 500; }
    .log-entry { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .log-entry:last-child { border-bottom: none; }
    .log-time { font-size: 12px; color: #aaa; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="status-bar">
  <div>
    <h1>Smart Irrigation</h1>
    <p class="subtitle">Pune, Maharashtra</p>
  </div>
  <span class="badge online" id="status">Connecting...</span>
</div>

<div class="grid">
  <div class="card">
    <p class="card-label">Soil moisture</p>
    <p class="card-value" id="soil">--</p>
    <span class="badge dry" id="soil-badge">--</span>
  </div>
  <div class="card">
    <p class="card-label">Temperature</p>
    <p class="card-value" id="temp">--</p>
  </div>
  <div class="card">
    <p class="card-label">Humidity</p>
    <p class="card-value" id="humidity">--</p>
  </div>
  <div class="card">
    <p class="card-label">Rain chance</p>
    <p class="card-value" id="rain">--</p>
  </div>
</div>

<div class="pump-card">
  <p class="card-label">Pump control</p>
  <div class="pump-status">
    <div class="led" id="led"></div>
    <span id="pump-label" style="font-size:16px;font-weight:500">--</span>
  </div>
  <button class="btn btn-on" onclick="setPump(true)">Turn ON</button>
  <button class="btn btn-off" onclick="setPump(false)">Turn OFF</button>
</div>

<div class="log-card">
  <p class="log-title">Event log</p>
  <div id="log-entries">Loading...</div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAwr5hB5kwuO-oKIn5EGgbX-INXHF5rEUY",              
    databaseURL: "https://smart-irrigation-system-c10ea-default-rtdb.asia-southeast1.firebasedatabase.app/",   
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Live sensor data
  db.ref("/sensor").on("value", snap => {
    const d = snap.val();
    if (!d) return;
    document.getElementById("soil").textContent = d.soil ?? "--";
    document.getElementById("temp").textContent = (d.temperature ?? "--") + "°C";
    document.getElementById("humidity").textContent = (d.humidity ?? "--") + "%";
    document.getElementById("rain").textContent = (d.rain ?? "--") + "%";
    document.getElementById("status").textContent = "Online";

    const soilBadge = document.getElementById("soil-badge");
    if (d.soil > 2450) { soilBadge.textContent = "DRY"; soilBadge.className = "badge dry"; }
    else if (d.soil > 1550) { soilBadge.textContent = "MEDIUM"; soilBadge.className = "badge"; soilBadge.style.background="#FAEEDA"; soilBadge.style.color="#854F0B"; }
    else { soilBadge.textContent = "MOIST"; soilBadge.className = "badge moist"; }
  });

  // Pump status
  db.ref("/pump").on("value", snap => {
    const on = snap.val() === 1;
    document.getElementById("led").className = "led" + (on ? " on" : "");
    document.getElementById("pump-label").textContent = on ? "ON" : "OFF";
  });

  // Pump control
  function setPump(on) {
    db.ref("/pump").set(on ? 1 : 0);
  }

  // Event log — last 10 entries
  db.ref("/logs").limitToLast(10).on("value", snap => {
    const entries = snap.val();
    const container = document.getElementById("log-entries");
    if (!entries) { container.textContent = "No logs yet"; return; }
    const keys = Object.keys(entries).reverse();
    container.innerHTML = keys.map(k => {
      const e = entries[k];
      return `<div class="log-entry">
        <span>${e.action ?? "--"}</span>
        <span class="log-time">${k.replace("_", " ")}</span>
      </div>`;
    }).join("");
  });
</script>
</body>
</html>
